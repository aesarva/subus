<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Subus — значок в строке меню</title>
<style>
:root{--acc:#E5352B}
body{font:14px/1.4 -apple-system,"SF Pro Text",sans-serif;margin:24px;background:#ECECEA;color:#1D1D1F}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:#55554F}
.acc{display:flex;gap:8px;align-items:center;margin-bottom:20px}
.acc button{border:1px solid #bbb;background:#fff;border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card h2{font-size:15px;margin:0 0 2px}
.card .why{font-size:12px;color:#55554F;margin:0 0 10px;min-height:32px}
.big{display:flex;gap:18px;align-items:center;margin-bottom:10px}
.big .l{background:#F6F6F3;border-radius:10px;padding:10px;color:#1D1D1F}
.big .d{background:#1C1C1E;border-radius:10px;padding:10px;color:#F2F2F0}
.bar{display:flex;justify-content:flex-end;align-items:center;gap:14px;height:24px;padding:0 10px;border-radius:6px;font-size:13px;margin-top:6px}
.bar.light{background:rgba(246,246,243,.92);color:#1D1D1F;border:1px solid #ddd}
.bar.dark{background:#2A2A2C;color:#F2F2F0}
.bar .item{display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.bar .ghost{opacity:.75}
svg{display:block}
.tag{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:#1D1D1F;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px}
</style></head><body>
<h1>Значок Subus в строке меню</h1>
<p class="sub">Каждый вариант: крупно (72 pt) и в реальном размере (18 pt) на светлой и тёмной строке меню рядом с цифрой «3д». Цветная часть — акцент, остальное — цвет строки меню.</p>
<div class="acc">Акцент:
<button onclick="document.documentElement.style.setProperty('--acc','#E5352B')">красный</button>
<button onclick="document.documentElement.style.setProperty('--acc','#0A84FF')">синий (системный)</button>
<button onclick="document.documentElement.style.setProperty('--acc','#FF9F0A')">оранжевый</button>
<button onclick="document.documentElement.style.setProperty('--acc','#30D158')">зелёный</button>
<button onclick="document.documentElement.style.setProperty('--acc','#BF5AF2')">фиолетовый</button>
</div>

<svg width="0" height="0" style="position:absolute">
<defs>
 <!-- A: renewal ring with charge dot -->
 <symbol id="A" viewBox="0 0 18 18">
  <path d="M15 9a6 6 0 1 1-2.2-4.65" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <path d="M13.6 1.9v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="9" cy="9" r="2.6" fill="var(--acc)"/>
 </symbol>
 <!-- B: calendar page with marked day -->
 <symbol id="B" viewBox="0 0 18 18">
  <rect x="2.5" y="3.5" width="13" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M2.5 7.2h13" stroke="currentColor" stroke-width="2"/>
  <path d="M6 1.8v3M12 1.8v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <circle cx="11.6" cy="11.6" r="2.3" fill="var(--acc)"/>
 </symbol>
 <!-- C: ticket stub (абонемент) -->
 <symbol id="C" viewBox="0 0 18 18">
  <path d="M2 5.5a1.5 1.5 0 0 1 1.5-1.5h11A1.5 1.5 0 0 1 16 5.5v1.8a1.8 1.8 0 0 0 0 3.4v1.8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 2 12.5v-1.8a1.8 1.8 0 0 0 0-3.4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
  <path d="M11 4.6v8.8" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.4 1.6"/>
  <circle cx="6.5" cy="9" r="2.2" fill="var(--acc)"/>
 </symbol>
 <!-- D: coin with cycle -->
 <symbol id="D" viewBox="0 0 18 18">
  <circle cx="9" cy="9" r="6.3" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M9 2.7a6.3 6.3 0 0 1 6.3 6.3" fill="none" stroke="var(--acc)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M7 7.2c0-1 .9-1.6 2-1.6s2 .6 2 1.5c0 2-4 1.4-4 3.4 0 .9.9 1.5 2 1.5s2-.6 2-1.6M9 4.6v1M9 12v1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
 </symbol>
 <!-- E: S monogram with orbit dot -->
 <symbol id="E" viewBox="0 0 18 18">
  <path d="M12.6 5.4c-.5-1.2-1.9-2-3.6-2-2.1 0-3.6 1.1-3.6 2.7 0 3.6 7.4 2.3 7.4 6 0 1.7-1.6 2.6-3.8 2.6-1.8 0-3.2-.8-3.8-2.1" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
  <circle cx="14.6" cy="3.4" r="2.2" fill="var(--acc)"/>
 </symbol>
 <!-- F: countdown arc (pie) — days left -->
 <symbol id="F" viewBox="0 0 18 18">
  <circle cx="9" cy="9" r="6.6" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M9 9V2.4A6.6 6.6 0 0 1 15.3 11Z" fill="var(--acc)"/>
 </symbol>
 <!-- G: vertical line with stations (bolder Line) -->
 <symbol id="G" viewBox="0 0 18 18">
  <path d="M9 2v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="9" cy="4" r="2.6" fill="var(--acc)"/>
  <circle cx="9" cy="10" r="2.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <circle cx="9" cy="15" r="1.4" fill="currentColor"/>
 </symbol>
 <!-- H: stacked cards (subscriptions) -->
 <symbol id="H" viewBox="0 0 18 18">
  <rect x="2" y="6" width="12" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M5 3.5h9.5a1.5 1.5 0 0 1 1.5 1.5v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <rect x="4.5" y="10.5" width="4" height="2.2" rx="1.1" fill="var(--acc)"/>
 </symbol>
</defs></svg>

<div class="grid" id="g"></div>
<script>
const v=[
 ["A","Обновление + точка","Кольцо со стрелкой «продление», в центре — точка ближайшего списания. Сразу читается как «подписка»."],
 ["B","Календарь с отметкой","Листок календаря, цветная точка — день списания. Самый понятный, но самый привычный."],
 ["C","Абонемент","Билет-талон с перфорацией; цветной кружок — «оплачено до». Подписка как абонемент."],
 ["D","Монета в цикле","Монета, цветная дуга — сколько осталось до списания. Про деньги и время сразу."],
 ["E","Буква S","Фирменная «S» с цветной точкой-спутником. Узнаваемо как бренд, но не объясняет назначение."],
 ["F","Обратный отсчёт","Круг-таймер, цветной сектор — часть цикла до списания. Простой и крупный."],
 ["G","Линия (усиленная)","Вертикальная линия метро: верхняя цветная станция — ближайшее списание. Продолжает дизайн панели."],
 ["H","Стопка карточек","Карточки подписок, цветная полоска — карта оплаты. Про «много подписок»."]
];
const g=document.getElementById('g');
for(const [id,name,why] of v){
 const ic=(s)=>`<svg width="${s}" height="${s}"><use href="#${id}"/></svg>`;
 g.insertAdjacentHTML('beforeend',`<div class="card"><h2>${id} · ${name}</h2><p class="why">${why}</p>
 <div class="big"><div class="l">${ic(72)}</div><div class="d">${ic(72)}</div></div>
 <div class="bar light"><span class="ghost">⌁</span><span class="item">${ic(18)}3д</span><span class="ghost">Вт 20 окт. 17:05</span></div>
 <div class="bar dark"><span class="ghost">⌁</span><span class="item">${ic(18)}3д</span><span class="ghost">Вт 20 окт. 17:05</span></div></div>`);
}
</script>
</body></html>
